version: '3.8'

networks:
  atelier-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-postgres
    restart: unless-stopped
    networks:
      - atelier-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atelier}
      POSTGRES_USER: ${POSTGRES_USER:-atelier_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Expose PostgreSQL port (bound to 127.0.0.1 for local security or 0.0.0.0 for external connection)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelier_user} -d ${POSTGRES_DB:-atelier}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sync-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atelier-sync-api
    restart: unless-stopped
    networks:
      - atelier-net
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-atelier_user}:${POSTGRES_PASSWORD:-atelier_secret_password}@postgres:5432/${POSTGRES_DB:-atelier}}
      SYNC_API_KEY: ${SYNC_API_KEY:-atelier_secret_api_key}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
