name = "atelier-telegram-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Daily Morning Briefing (06:00 UTC+7 = 23:00 UTC), Afternoon Check-in (16:00 UTC+7 = 09:00 UTC), Evening Review (21:00 UTC+7 = 14:00 UTC)
crons = ["0 23 * * *", "0 9 * * *", "0 14 * * *"]

[vars]
TELEGRAM_BOT_USERNAME = "AtelierProductivityBot"

# Secrets to be configured via `wrangler secret put <KEY>`:
# - TELEGRAM_BOT_TOKEN (API token from @BotFather)
# - DATABASE_URL (PostgreSQL connection string or Neon/Supabase pooler)
# - WEBHOOK_SECRET (Random secret token for X-Telegram-Bot-Api-Secret-Token)
